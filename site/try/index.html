<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sage Stage — your classroom screen, your data</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css?v=1" />
  <link rel="stylesheet" href="style.css?v=110" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
</head>
<body>
  <div id="stage"></div>

  <div id="topbar">
    <div class="brand">
      <span class="logo">🌿</span>
      <span id="brandName">Sage Stage</span>
      <span class="tag">100% local</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="homeBtn" data-help="homeBtn" title="All decks & class lists">🏠</button>
      <button class="icon-btn" id="dataBtn" data-help="dataBtn" title="Your data — backup, restore, and recently closed widgets">💾</button>
      <button class="icon-btn" id="helpBtn" data-help="helpBtn" title="Help — what you're looking at, and where your data lives">❓</button>
      <button class="icon-btn" id="fullscreenBtn" data-help="fullscreenBtn" title="Fullscreen">⛶</button>
    </div>
  </div>

  <div id="toolbar"></div>

  <div id="screenNav">
    <button id="prevScreen" data-help="prevScreen" title="Previous screen">‹</button>
    <button id="deckBtn" data-help="deckBtn" title="Screens"><span id="screenLabel">1 / 1</span></button>
    <button id="nextScreen" data-help="nextScreen" title="Next screen">›</button>
    <button id="addScreen" data-help="addScreen" title="Add screen">＋</button>
    <button id="delScreen" data-help="delScreen" title="Delete this screen">🗑</button>
  </div>

  <canvas id="drawLayer"></canvas>
  <div id="drawTools"></div>

  <div id="toast"></div>

  <script src="sanitize.js?v=1"></script>
  <script src="snapshots.js?v=2"></script>
  <script src="qr.js?v=5"></script>
  <script src="templates.js?v=5"></script>
  <script src="icons-scarlab.js?v=6"></script>
  <script src="icons.js?v=27"></script>
  <script src="export.js?v=4"></script>
  <script src="print.js?v=15"></script>
  <script src="pptx-import.js?v=2"></script>
  <script src="english-packs.js?v=4"></script>
  <script src="zip.js?v=2"></script>
  <script src="doctext.js?v=2"></script>
  <script src="english-word.js?v=42"></script>
  <script src="modelwrite.js?v=28"></script>
  <script src="english-text.js?v=17"></script>
  <script src="help/widgets-data.js?v=1"></script>
  <script src="demo.js"></script>
  <script src="storage.js?v=2"></script>
  <script src="app.js?v=72"></script>
</body>
</html>
